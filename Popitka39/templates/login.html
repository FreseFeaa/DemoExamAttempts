<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <title>Пассажирам.РФ</title>
</head>
<body>
    <h1>Вход</h1>

    <div>
        <img src="/static/assets/e295464686cc17d074cb2f14.jpg" alt="Это электробус" class="elebus">
    </div>

    {%if error%}
    <p style="color: red;">{{error}}</p>
    {%endif%}

    <form method="post">
        Логин: <input type="text" name="login" required> <br>
        Пароль: <input type="password" name="password" required> <br>
        <button type="submit">Потвердить</button>
    </form>
    <p>Еще не зарегистрированы? <a href="/register">Регистрация</a></p>
</body>
</html>
