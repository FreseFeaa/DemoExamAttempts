<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <title>Пассажирам.РФ</title>
</head>
<body>
    <h1>Новая заявка</h1>
    <div class="nav">
        <a href="/profile">Назад</a>
    </div>
    

    <form method="post">
        Вид транспорта: <select name="transport">
            {%for t in transports%}
            <option value="{{t}}">{{t}}</option>
            {%endfor%}
        </select> <br>

        Дата старта: <input type="date" name="date" required><br>

        Способ оплаты: <select name="payment">
            {%for p in payments%}
            <option value="{{p}}">{{p}}</option>
            {%endfor%}
        </select> <br>
        <button type="submit">Потвердить</button>
    </form>
</body>
</html>
