<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <title>Пассажирам.РФ</title>
</head>
<body>
    <h1>Регистрация</h1>

    <div>
        <img src="/static/assets/e295464686cc17d074cb2f14.jpg" alt="Это электробус" class="elebus">
    </div>

    {%if error%}
    <p style="color: red;">{{error}}</p>
    {%endif%}

    <form method="post">
        Логин: <input type="text" name="login" value="{{login}}" required> <br>
        Пароль: <input type="password" name="password" required> <br>
        ФИО: <input type="text" name="fio" value="{{fio}}" required> <br>
        Дата рождения: <input type="date" name="date_b" value="{{date_b}}" required> <br>
        Почта: <input type="text" name="email" value="{{email}}" required> <br>
        Телефон: <input type="text" name="phone" value="{{phone}}" required> <br>
        <button type="submit">Подтвердить</button>
    </form>
    <p>Уже зарегистрированы? <a href="/login">Вход</a></p>
</body>
</html>
